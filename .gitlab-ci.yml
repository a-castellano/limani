image: registry.windmaker.net:5005/a-castellano/limani/base_docker:202112131727

stages:
    - build_base
    - build_base_inherited_images
    - build_base_inherited_images_2nd_gen
    - build_base_inherited_images_3rd_gen

build_base_image:
    stage: build_base
    script:
        - export IMAGE_NAME=base
        - export IS_BASE_IMAGE=1
        - docker-build
    artifacts:
        paths:
        - timestamp
        expire_in: 240 minutes

build_base_node12_image:
    stage: build_base_inherited_images
    script:
        - export IMAGE_NAME=base_node12
        - export IS_BASE_IMAGE=0
        - docker-build
    dependencies:
    - build_base_image

